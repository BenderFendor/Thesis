\* Exhaustive baseline is deliberately small: two articles retain cross-item
\* queue and invalidation coverage while one worker keeps the asynchronous
\* running-write/invalidation/cancellation races finite and tractable.
\* The earlier 2x2/queue-2/generation-2/retry-2 configuration is retained
\* only as a deterministic simulation stress run, not exhaustive proof.
SPECIFICATION Spec

CONSTANT Articles = {"article-1", "article-2"}
CONSTANT Workers = {"worker-1"}
CONSTANT QueueCapacity = 1
CONSTANT MaxGeneration = 1
CONSTANT MaxRetries = 1

INVARIANT TypeOK
INVARIANT WriteBeforeMarker
INVARIANT NoStaleCommit
INVARIANT NoCommitAfterInvalidationOrShutdown
INVARIANT RetryDropSoundness
INVARIANT QueueAccounting
INVARIANT NoDuplicateFinalResult

PROPERTY SafetyProperties
