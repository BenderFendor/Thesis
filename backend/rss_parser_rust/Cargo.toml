[package]
name = "rss_parser_rust"
version = "0.1.0"
edition = "2021"
description = "High performance RSS ingestion pipeline for My Thesis's backend"
license = "MIT"

[lib]
name = "rss_parser_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
feed-rs = "2.3"
futures = "0.3"
once_cell = "1.19"
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py311"] }
rayon = "1.10"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "deflate", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "time"] }
url = "2.5"
thesis-evidence = { path = "../crates/thesis-evidence" }
thesis-ingest = { path = "../crates/thesis-ingest" }
thesis-search = { path = "../crates/thesis-search" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
