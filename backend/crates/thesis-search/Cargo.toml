[package]
name = "thesis-search"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aho-corasick = "1.1"
once_cell = "1.19"
md5 = "0.7"
rayon = "1.10"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
strsim = "0.11"
unicode-general-category = "=0.6.0"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.6"
serde_json = "1.0"

[[bench]]
name = "minhash"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
