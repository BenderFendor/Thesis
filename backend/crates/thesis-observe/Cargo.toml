[package]
name = "thesis-observe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Local process and host resource observability for Thesis"

[dependencies]
chrono = "0.4"
serde_json = "1.0"
tokio = { version = "1.39", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"
