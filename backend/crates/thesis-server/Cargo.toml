[package]
name = "thesis-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
feed-rs = "=2.4.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["async-await", "std"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thesis-api = { path = "../thesis-api" }
thesis-db = { path = "../thesis-db" }
thesis-ingest = { path = "../thesis-ingest" }
tokio = { version = "1.39", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "5.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
