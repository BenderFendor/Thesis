[package]
name = "thesis-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["json", "ws"] }
regex = "=1.13.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thesis-db = { path = "../thesis-db" }
thesis-evidence = { path = "../thesis-evidence" }
thesis-ingest = { path = "../thesis-ingest" }
thesis-search = { path = "../thesis-search" }
thesis-runtime = { path = "../thesis-runtime" }
thesis-observe = { path = "../thesis-observe" }
tracing = "0.1"
tower-http = { version = "=0.6.11", features = ["compression-gzip", "cors", "trace"] }
utoipa = { version = "5.4", features = ["chrono"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["async-await", "std"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1.39", features = ["macros", "rt", "sync", "time"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
