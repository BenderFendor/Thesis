name: Persistence regression

on:
  push:
    branches: ["quality/crap-mi-oxlint-hardening"]
    paths:
      - "backend/app/services/persistence.py"
      - "backend/tests/test_persistence_embedding.py"
      - ".github/workflows/persistence-regression.yml"

permissions:
  contents: read

jobs:
  persistence-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENABLE_DATABASE: "0"
      ENABLE_VECTOR_STORE: "0"
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/crap-mi-oxlint-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "ruff==0.15.22" "pytest>=8.0.0" "pytest-asyncio>=0.23.0"
      - name: Check formatting
        run: ruff format --check --diff app/services/persistence.py
      - name: Check lint
        run: ruff check app/services/persistence.py
      - name: Compile persistence
        run: python -m compileall -q app/services/persistence.py
      - name: Run embedding persistence regressions
        run: pytest -q tests/test_persistence_embedding.py
