name: Source bundle

on:
  push:
    branches: ["quality/crap-mi-oxlint-hardening"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source tree
        run: |
          git archive --format=zip --output=/tmp/thesis-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: thesis-source
          path: /tmp/thesis-source.zip
          retention-days: 1
      - name: Fetch cccc 1.6.0
        run: |
          curl -fsSL -o /tmp/cccc.tar.gz https://github.com/moznion/cccc/releases/download/v1.6.0/cccc-v1.6.0-x86_64-unknown-linux-musl.tar.gz
          echo "8a4492a877d566edb75aa8b8501f28a21fdb43789d125e6ac99dfc67a00a919b  /tmp/cccc.tar.gz" | sha256sum -c -
          mkdir -p /tmp/cccc-extract
          tar -xzf /tmp/cccc.tar.gz -C /tmp/cccc-extract
          find /tmp/cccc-extract -type f -name cccc -perm -111 -exec cp {} /tmp/cccc \;
          test -x /tmp/cccc
      - uses: actions/upload-artifact@v4
        with:
          name: cccc-linux
          path: /tmp/cccc
          retention-days: 1
