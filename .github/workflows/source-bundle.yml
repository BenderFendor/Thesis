name: Source bundle

on:
  push:
    branches: ["quality/crap-mi-oxlint-hardening"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source tree
        run: |
          git archive --format=zip --output=/tmp/thesis-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: thesis-source
          path: /tmp/thesis-source.zip
          retention-days: 1
