name: Apply verified local lint fix

on:
  push:
    branches:
      - quality/crap-mi-oxlint-hardening
    paths:
      - ".github/workflows/apply-local-lint-fix.yml"
      - ".lint-fix/**"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and repair transfer payload
        shell: bash
        run: |
          set -euo pipefail
          cat .lint-fix/chunk-* > /tmp/lint-fix.patch.xz.b64
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/lint-fix.patch.xz.b64')
          payload = bytearray(path.read_bytes())
          offset = 48808
          if payload[offset:offset + 1] != b'a':
              raise SystemExit(f'unexpected transfer byte at {offset}: {payload[offset:offset + 1]!r}')
          payload[offset] = ord('e')
          path.write_bytes(payload)
          PY
          base64 --decode /tmp/lint-fix.patch.xz.b64 > /tmp/lint-fix.patch.xz
          echo "db20bb027ba4dc98f97379932faf7f60a26dfa8cfe47ae5e40c51cc7f4c2089b  /tmp/lint-fix.patch.xz" | sha256sum --check
          xz --decompress --stdout /tmp/lint-fix.patch.xz > /tmp/lint-fix.patch
          echo "b3eabe4c776e9984e2c5a3ed3274f837bf169dba200a6d0d3639807a29cfefaa  /tmp/lint-fix.patch" | sha256sum --check
          git apply --check /tmp/lint-fix.patch
          git apply /tmp/lint-fix.patch

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "quality: eliminate Oxlint hard errors"
          git push origin HEAD:quality/crap-mi-oxlint-hardening
