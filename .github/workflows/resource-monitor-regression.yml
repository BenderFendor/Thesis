name: Resource monitor regression

on:
  push:
    branches: ["quality/crap-mi-oxlint-hardening"]
    paths:
      - "backend/app/services/resource_monitor.py"
      - "backend/tests/test_resource_monitor.py"
      - ".github/workflows/resource-monitor-regression.yml"

permissions:
  contents: read

jobs:
  resource-monitor-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/crap-mi-oxlint-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install --quiet "ruff==0.15.22" "pytest>=8.0.0" "psutil>=5.9.0"
      - name: Check formatting
        run: ruff format --check --diff app/services/resource_monitor.py
      - name: Check lint
        run: ruff check app/services/resource_monitor.py
      - name: Compile resource monitor
        run: python -m compileall -q app/services/resource_monitor.py
      - name: Run resource monitor regressions
        run: pytest -q tests/test_resource_monitor.py
