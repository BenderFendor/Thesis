name: Quality bootstrap

on:
  push:
    branches:
      - quality/crap-mi-oxlint-hardening

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[quality-bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/crap-mi-oxlint-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Migrate lint dependencies
        working-directory: frontend
        run: |
          npm uninstall --save-dev eslint eslint-config-next eslint-plugin-react-hooks
          npm install --save-dev --save-exact oxlint@1.80.0 @oxlint/plugins@1.80.0 oxlint-tsgolint@7.0.2001
          npm pkg set 'scripts.lint=oxlint -c ../.oxlintrc.json . ../scripts'
          npm pkg set 'scripts.lint:fix=oxlint -c ../.oxlintrc.json --fix . ../scripts'
      - name: Vendor anti-slop
        run: |
          rm -rf /tmp/anti-slop
          git clone --quiet https://github.com/dmmulroy/anti-slop.git /tmp/anti-slop
          git -C /tmp/anti-slop checkout --quiet 6d538555cb151d4121ed51a27db81890eacf8ae9
          rm -rf frontend/tools/oxlint/anti-slop
          mkdir -p frontend/tools/oxlint/anti-slop
          cp -R /tmp/anti-slop/src/. frontend/tools/oxlint/anti-slop/
          cp /tmp/anti-slop/LICENSE frontend/tools/oxlint/anti-slop/LICENSE
          cat > frontend/tools/oxlint/anti-slop/UPSTREAM.md <<'EOF'
          # Vendored anti-slop

          Source: `dmmulroy/anti-slop`

          Commit: `6d538555cb151d4121ed51a27db81890eacf8ae9`

          The upstream project distributes this plugin as source and recommends vendoring it into the consuming repository. Keep project-specific rules outside this directory.
          EOF
      - name: Remove ESLint configs and bootstrap workflow
        run: |
          rm -f eslint.config.mjs frontend/eslint.config.mjs
          sed -i '/eslint-disable @typescript-eslint\/no-require-imports/d' frontend/jest.config.js
          rm .github/workflows/quality-bootstrap.yml
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: migrate frontend linting to Oxlint [quality-bootstrap]"
          git push origin HEAD:quality/crap-mi-oxlint-hardening
