name: Format evidence export

on:
  push:
    branches: ["quality/crap-mi-oxlint-hardening"]
    paths:
      - ".github/workflows/format-evidence-export.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/crap-mi-oxlint-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format evidence export
        run: |
          python -m pip install --quiet ruff==0.15.22
          ruff format backend/app/services/evidence_export.py backend/app/services/evidence_export_formats.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/evidence_export.py backend/app/services/evidence_export_formats.py
          git diff --cached --quiet && exit 0
          git commit -m "style: format evidence export refactor"
          git push origin HEAD:quality/crap-mi-oxlint-hardening
