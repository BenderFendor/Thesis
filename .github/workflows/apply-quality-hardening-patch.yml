name: Apply quality hardening patch

on:
  push:
    branches: ["quality/crap-mi-oxlint-hardening"]
    paths:
      - ".github/quality-hardening-replacements.json"
  workflow_dispatch:

concurrency:
  group: apply-quality-hardening-patch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/crap-mi-oxlint-hardening
          fetch-depth: 0
      - name: Apply exact replacements
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/quality-hardening-replacements.json
          if [[ ! -f "$payload" ]]; then
            echo "No replacement payload present; nothing to apply."
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          payload_path = Path(".github/quality-hardening-replacements.json")
          replacements = json.loads(payload_path.read_text())
          for replacement in replacements:
              path = Path(replacement["path"])
              old = replacement["old"]
              new = replacement["new"]
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one match in {path}, found {count}"
                  )
              path.write_text(text.replace(old, new, 1))
          payload_path.unlink()
          PY
      - name: Commit applied refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "refactor: apply quality hardening patch"
          git push origin HEAD:quality/crap-mi-oxlint-hardening
