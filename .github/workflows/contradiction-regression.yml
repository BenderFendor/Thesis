name: Contradiction extraction regression

on:
  push:
    branches: ["quality/crap-mi-oxlint-hardening"]
    paths:
      - "backend/app/services/contradiction_extractor.py"
      - "backend/tests/test_contradiction_extractor.py"
      - ".github/workflows/contradiction-regression.yml"

permissions:
  contents: read

jobs:
  contradiction-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENABLE_DATABASE: "0"
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/crap-mi-oxlint-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --quiet \
            "ruff==0.15.22" \
            "pytest>=8.0.0" \
            "pytest-asyncio>=0.23.0" \
            "sqlalchemy>=2.0.35" \
            "aiosqlite>=0.20.0" \
            "httpx>=0.25.2" \
            "python-dotenv>=1.0.0" \
            "google-genai>=0.1.0" \
            "openai>=1.0.0"
      - name: Check formatting
        run: ruff format --check --diff app/services/contradiction_extractor.py
      - name: Check lint
        run: ruff check app/services/contradiction_extractor.py
      - name: Compile contradiction extractor
        run: python -m compileall -q app/services/contradiction_extractor.py
      - name: Run contradiction regressions
        run: pytest -q tests/test_contradiction_extractor.py
