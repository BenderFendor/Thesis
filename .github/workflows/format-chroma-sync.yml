name: Format Chroma sync

on:
  push:
    branches: ["quality/crap-mi-oxlint-hardening"]
    paths:
      - ".github/workflows/format-chroma-sync.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/crap-mi-oxlint-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format Chroma sync
        run: |
          python -m pip install --quiet ruff==0.15.22
          ruff format backend/app/services/chroma_sync.py backend/tests/test_chroma_sync_recovery.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/chroma_sync.py backend/tests/test_chroma_sync_recovery.py
          git diff --cached --quiet && exit 0
          git commit -m "style: format Chroma recovery refactor"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:quality/crap-mi-oxlint-hardening; then
              exit 0
            fi
            git pull --rebase origin quality/crap-mi-oxlint-hardening
          done
          exit 1
