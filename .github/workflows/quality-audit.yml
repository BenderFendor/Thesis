name: Quality advisory audit (artifact only)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository analyzers
        run: |
          npm ci --no-audit --no-fund
          npm --prefix frontend ci --no-audit --no-fund
          python -m pip install --quiet radon==6.0.1 vulture==2.14
          curl -fsSL -o /tmp/cccc.tar.gz https://github.com/moznion/cccc/releases/download/v1.6.0/cccc-v1.6.0-x86_64-unknown-linux-musl.tar.gz
          echo "8a4492a877d566edb75aa8b8501f28a21fdb43789d125e6ac99dfc67a00a919b  /tmp/cccc.tar.gz" | sha256sum -c -
          mkdir -p /tmp/cccc-extract
          tar -xzf /tmp/cccc.tar.gz -C /tmp/cccc-extract
          CCCC="$(find /tmp/cccc-extract -type f -name cccc -perm -111 | head -1)"
          test -n "$CCCC"
          sudo cp "$CCCC" /usr/local/bin/cccc
      - name: Measure repository
        run: node scripts/quality-hardening.mjs measure --scope repo --json > /tmp/qh-measurement.json
      - name: Show compact summary
        run: node scripts/quality-hardening.mjs summary --json
      - name: Upload measurement artifact
        uses: actions/upload-artifact@v4
        with:
          name: quality-audit-measurement
          path: |
            /tmp/qh-measurement.json
            .quality-hardening/measurements/*.json
          if-no-files-found: warn
          retention-days: 7
