name: Apply verified quality refactor

on:
  push:
    branches: ["quality/crap-mi-oxlint-hardening"]
    paths:
      - ".github/quality-refactor-payload.b64"
      - ".github/workflows/apply-quality-refactor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/crap-mi-oxlint-hardening
      - name: Apply verified patch payload
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/quality-refactor-payload.b64
          if [[ ! -f "$payload" ]]; then
            echo "No payload; nothing to apply."
            exit 0
          fi
          base64 --decode "$payload" | gzip --decompress > /tmp/quality-refactor.patch
          git apply --check /tmp/quality-refactor.patch
          git apply /tmp/quality-refactor.patch
          rm "$payload"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: reduce deterministic complexity debt"
          git push
