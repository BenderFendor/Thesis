name: Apply verified quality refactor

on:
  push:
    branches: ["quality/crap-mi-oxlint-hardening"]
    paths:
      - ".github/quality-refactor-payload.patch.gz"
      - ".github/workflows/apply-quality-refactor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/crap-mi-oxlint-hardening
          fetch-depth: 0
      - name: Apply verified patch payload
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/quality-refactor-payload.patch.gz
          if [[ ! -f "$payload" ]]; then
            echo "No payload; nothing to apply."
            exit 0
          fi
          gzip --decompress --stdout "$payload" > /tmp/quality-refactor.patch
          git apply --check /tmp/quality-refactor.patch
          git apply /tmp/quality-refactor.patch
          rm "$payload"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: reduce deterministic complexity debt"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:quality/crap-mi-oxlint-hardening; then
              exit 0
            fi
            echo "Push raced with another workflow; rebasing (attempt $attempt)."
            git pull --rebase origin quality/crap-mi-oxlint-hardening
          done
          echo "Failed to persist verified refactor after retries." >&2
          exit 1
