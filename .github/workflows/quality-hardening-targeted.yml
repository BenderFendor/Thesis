name: Quality hardening targeted checks

on:
  push:
    branches: ["quality/crap-mi-oxlint-hardening"]
    paths:
      - "frontend/app/saved/**"
      - "frontend/app/sources/[source]/debug/**"
      - "frontend/components/highlight-toolbar.tsx"
      - "frontend/lib/api.ts"
      - "frontend/lib/feed-ranking.ts"
      - ".github/workflows/quality-hardening-targeted.yml"
  workflow_dispatch:

concurrency:
  group: quality-hardening-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/crap-mi-oxlint-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install analyzers
        run: |
          npm ci --no-audit --no-fund
          npm --prefix frontend ci --no-audit --no-fund
      - name: Targeted Oxlint
        continue-on-error: true
        run: |
          PATH="$PWD/frontend/node_modules/.bin:$PATH" \
            timeout 5m frontend/node_modules/.bin/oxlint -c .oxlintrc.json --format unix \
            frontend/app/saved/page.tsx \
            frontend/app/saved/saved-workspace-model.ts \
            frontend/app/saved/saved-workspace-view.tsx \
            frontend/app/saved/use-saved-workspace-controller.ts \
            'frontend/app/sources/[source]/debug/page.tsx' \
            'frontend/app/sources/[source]/debug/source-debug-view.tsx' \
            frontend/components/highlight-toolbar.tsx \
            frontend/lib/api.ts \
            frontend/lib/feed-ranking.ts
      - name: TypeScript
        continue-on-error: true
        run: |
          rm -f frontend/tsconfig.tsbuildinfo
          npm --prefix frontend exec -- tsc -p frontend/tsconfig.json --noEmit
      - name: Import resolution
        continue-on-error: true
        run: node scripts/check-imports.mjs
      - name: Maintainability
        continue-on-error: true
        run: |
          npx code-multivitals \
            'frontend/app/saved/**/*.{ts,tsx}' \
            'frontend/app/sources/[source]/debug/**/*.{ts,tsx}' \
            'frontend/components/highlight-toolbar.tsx' \
            'frontend/lib/api.ts' \
            'frontend/lib/feed-ranking.ts' \
            --reporter console
