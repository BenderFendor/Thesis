name: Oxlint safe autofix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/crap-mi-oxlint-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Apply safe Oxlint fixes
        shell: bash
        run: |
          export OXLINT_TSGOLINT_PATH="$PWD/frontend/node_modules/.bin/tsgolint"
          test -x "$OXLINT_TSGOLINT_PATH"
          set +e
          frontend/node_modules/.bin/oxlint -c .oxlintrc.json --fix frontend
          set -e
          git diff --check
      - name: Commit safe fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No safe Oxlint fixes available"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "style: apply safe Oxlint fixes"
          git push origin HEAD:quality/crap-mi-oxlint-hardening
